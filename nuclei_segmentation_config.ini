[General]
image_path = IRI_regist.tif
output_dir = iri_results_small_0d09-12_5cl_32x32
upscale_factor = 1
enhance_contrast = True
enhance_dim = False
generate_overlay = False
crop_image = True
crop_bbox  = 0.25,0.3, 0.25,0.3


[CLAHE]
cliplimit = 5.0
tile_grid_size = 32,32

[Cellpose]
model_type = nuclei
gpu = True
diameter = 0
channels = 0,0
flow_threshold = 0.9
cellprob_threshold = -9
resample = True
stitch_threshold = 0.4

[EdgeDetection]
use_edge_detection = False
canny_threshold1 = 50
canny_threshold2 = 150

[Watershed]
apply_watershed = False
area_threshold = 1000
local_maxima_footprint = 3,3

[Tiling]
use_tiling = True
tile_side_length = 1024
tile_overlap = 0.1

[Overlay]
small_overlay_size = 1024
