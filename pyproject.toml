[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-cellpose"
version = "1.0.0"
description = "Adaptive Tiled Local Analysis Segmentation for large-scale nuclear segmentation using Cellpose3."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Christos Botos", email = "botoschristos@gmail.com"},
]
keywords = ["segmentation", "cellpose", "nuclei", "histology", "tiling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "pillow>=10.1",
    "scikit-learn>=1.3",
    "scikit-image>=0.22",
    "joblib>=1.3",
    "cellpose>=3.0.10,<4",
    "opencv-python-headless>=4.8",
    "imagecodecs>=2023.9",
    "imageio>=2.31",
    "tifffile>=2023.9",
    "roifile>=2023.8",
    "fastremap>=1.14",
    "anndata>=0.10",
    "scanpy>=1.9",
    "pyarrow>=13.0",
    "h5py>=3.10",
    "networkx>=3.2",
    "rich>=13.6",
    "tqdm>=4.66",
    "psutil>=5.9",
    "natsort>=8.4",
    "seaborn>=0.13",
    "pytest>=7.4",
]

[project.scripts]
atlas-cellpose = "atlas_cellpose.run_this:main"

[project.urls]
Homepage = "https://github.com/ChrisBotos/ATLAS-Cellpose"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
