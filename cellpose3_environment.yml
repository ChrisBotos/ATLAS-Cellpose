    - scikit-image==0.25.2
    - joblib==1.5.1
    - statsmodels==0.14.5
    - threadpoolctl==3.6.0

    # Deep learning framework
    - torch==2.5.1+cu121
    - torchaudio==2.5.1+cu121
    - torchvision==0.20.1+cu121

