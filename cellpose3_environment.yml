# Usage:
# conda create -n venv310_cellpose3 pytorch torchvision torchaudio pytorch-cuda=11.8 -c pytorch -c nvidia

name: venv310_cellpose3
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - numpy
  - scipy
  - pandas
  - matplotlib
  - seaborn
  - pillow
  - scikit-learn
  - scikit-image
  - joblib
  - statsmodels
  - pytorch=2.1.*
  - torchvision=0.16.*
  - torchaudio=2.1.*
  - pytorch-cuda=11.8
  - opencv
  - imageio
  - tifffile
  - h5py
  - networkx
  - pyarrow
  - fsspec
  - rich
  - click
  - tqdm
  - colorama
  - pytest
  - psutil
  - packaging
  - python-dateutil
  - pytz
  - six
  - typing-extensions
  - filelock
  - numba
  - llvmlite
  - sympy
  - pygments
  - jinja2
  - markupsafe

  # Additional Conda-available specialized packages.
  - anndata
  - scanpy
  - umap-learn
  - pynndescent
  - fastparquet
  - patsy
  - natsort

  # pip-only packages.
  - pip

  - pip:
    - cellpose==3.0.10
    - fastremap
    - roifile
    - cramjam
    - typer
    - shellingham
    - imagecodecs
    - lazy-loader
    - legacy-api-wrap
