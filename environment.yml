name: iri310
channels:
  - pytorch        # Put FIRST so strict priority can select PyTorch builds here.
  - nvidia
  - conda-forge
  - defaults
channel_priority: flexible  # Changed from strict to flexible for better dependency resolution.

dependencies:
  # ───────── Core Scientific Computing Stack ─────────
  - python=3.10
  - pip
  - numpy=1.26.*        # Last 1.x line, ABI stable for PyTorch 2.2. Essential for all numerical operations.
  - scipy=1.13.*        # Slightly older version for compatibility. Provides statistical and optimization functions.
  - pandas=2.2.*        # Relaxed version constraint for better compatibility. Critical for data manipulation.

  # ───────── Visualization and Image Processing ─────────
  - matplotlib=3.8.*    # Using 3.8.* for better compatibility. Essential for plotting and visualization.
  - scikit-image=0.22.* # Relaxed version for compatibility. Core image processing library for microscopy data.
  - pillow>=9.0         # Relaxed pillow version constraint. Image I/O and basic processing operations.
  - imageio             # Keep, no version pin needed. Handles diverse image formats for spatial data.

  # ───────── Machine Learning and Statistics ─────────
  - scikit-learn=1.4.*  # Slightly older version for compatibility. Classical ML algorithms for data analysis.
  - joblib              # Parallel processing utilities for efficient computation.
  - tqdm                # Progress bars for long-running bioinformatics analyses.

  # ───────── Deep Learning Framework ─────────
  - pytorch=2.2.0       # Stable version with CUDA support for GPU-accelerated cell segmentation.
  - torchvision=0.17.*  # Computer vision utilities for image preprocessing and augmentation.
  - torchaudio=2.2.0    # Audio processing (included for completeness, may be useful for signal processing).
  - pytorch-cuda=12.1   # Pulls the matching CUDA runtime for GPU acceleration.

  # ───────── Development and Testing ─────────
  - pytest             # Unit testing framework for code validation.
  - psutil             # System monitoring for memory and CPU usage tracking.

  # ───────── Specialized Bioinformatics Packages (via pip) ─────────
  - pip:
    - "cellpose>=3.0.0"   # State-of-the-art cell segmentation for nuclei identification.
    - "anndata"           # Annotated data structures for single-cell and spatial omics.
    - "scanpy"            # Single-cell analysis toolkit for spatial transcriptomics integration.
    - "transformers"      # Transformer models for potential NLP applications in bioinformatics.
    - "pyarrow"           # High-performance columnar data format for large datasets.
    - "fastparquet"       # Fast parquet file I/O for efficient data storage and retrieval.
    - "numpy<2.0"         # Ensure NumPy 1.x for compatibility with PyTorch and other packages.


## ═══════════════════════════════════════════════════════════════════════════════
## WORKING ENVIRONMENT SETUP INSTRUCTIONS FOR I/R KIDNEY INJURY ANALYSIS
## ═══════════════════════════════════════════════════════════════════════════════
##
## This environment has been successfully tested and validated in Ubuntu WSL.
## Designed specifically for spatial multiomics analysis of ischemia/reperfusion
## kidney injury, supporting cell segmentation, spatial transcriptomics, and
## metabolomics data integration.
##
## '''Setup Instructions'''
## 1. Install miniconda/conda if not already installed.
## 2. Install mamba for faster dependency resolution:
##    conda install -n base mamba -c conda-forge
## 3. Create the environment:
##    mamba env create -f environment.yml
## 4. Activate the environment:
##    conda activate iri310
## 5. Test the environment:
##    python test_environment.py
##
## '''Successfully Validated Package Versions'''
## - Python 3.10.13 (optimal compatibility for bioinformatics packages)
## - NumPy 1.26.4 (downgraded from 2.x for PyTorch compatibility)
## - SciPy 1.15.2 (statistical functions for spatial analysis)
## - Pandas 2.3.1 (data manipulation for omics datasets)
## - PyTorch 2.2.0 (CUDA: 12.1, GPU acceleration confirmed)
## - TorchVision 0.17.0 (computer vision for microscopy image processing)
## - scikit-image 0.25.0 (image processing for tissue analysis)
## - Cellpose 4.0.6 (state-of-the-art cell segmentation)
## - Scanpy 1.11.3 (single-cell and spatial transcriptomics analysis)
## - AnnData 0.11.4 (annotated data structures for omics)
## - Transformers 4.53.2 (transformer models for advanced analysis)
## - PyArrow 21.0.0 (high-performance data I/O)
## - FastParquet 2024.11.0 (efficient data storage format)
##
## '''Technical Configuration Notes'''
## - Uses Python 3.10 instead of 3.11 for superior package compatibility.
## - Uses flexible channel priority to resolve complex dependency conflicts.
## - NumPy constrained to <2.0 to avoid compatibility issues with PyTorch.
## - All packages successfully import and work together without conflicts.
## - GPU acceleration confirmed functional for deep learning segmentation tasks.
## - Optimized for memory-efficient processing of large spatial datasets.
##
## Author: Christos Botos
## Environment validated: 2025-01-21
## Compatible with: Ubuntu WSL, Linux systems with CUDA 12.1+
