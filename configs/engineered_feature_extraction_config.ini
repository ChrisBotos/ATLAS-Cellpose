[general]
; Simplified configuration for nuclear feature extraction and clustering analysis.
; This streamlined config contains only the parameters actually used by the current scripts.

; Enable nuclear feature extraction pipeline.
enable_feature_extraction = True

; Enable nuclear feature clustering analysis.
enable_clustering = True

; Enable visualization generation.
enable_visualizations = True

[feature_extraction]
; ─── Feature Category Selection ───────────────────────────────────────────────
; Enable/disable major feature categories for granular control.
; Size features: area, perimeter, axes, bounding box, Feret diameters.
extract_size_features = True

; Shape features: circularity, eccentricity, solidity, aspect ratio, compactness,
; elongation, roundness, form factor, convex area ratio, convexity.
extract_shape_features = True

; Neighborhood features: neighbor counts, densities, distances, clustering metrics.
extract_neighborhood_features = True

; Texture features: intensity statistics, entropy, gradients, GLCM properties.
; When True, extracts all 12 texture features (computationally expensive).
; When False, skips texture features for faster processing.
extract_texture_features = False

; ─── Individual Size Feature Selection ────────────────────────────────────────
; Control individual size features for fine-grained feature engineering.
extract_area = True
extract_perimeter = True
extract_equivalent_diameter = True
extract_major_axis_length = True
extract_minor_axis_length = True
extract_bounding_box_width = True
extract_bounding_box_height = True
extract_bounding_box_area = True
extract_feret_diameter_max = True
extract_feret_diameter_min = True

; ─── Individual Shape Feature Selection ───────────────────────────────────────
; Control individual shape features for morphological analysis.
extract_circularity = True
extract_eccentricity = True
extract_solidity = True
extract_aspect_ratio = True
extract_compactness = True
extract_elongation = True
extract_roundness = True
extract_form_factor = True
extract_convex_area_ratio = True
extract_convexity = True

; ─── Individual Neighborhood Feature Selection ────────────────────────────────
; Control individual neighborhood features for spatial analysis.
extract_neighbor_count = True
extract_neighbor_density = True
extract_mean_neighbor_distance = True
extract_std_neighbor_distance = True
extract_min_neighbor_distance = True
extract_max_neighbor_distance = True
extract_neighbor_area_mean = True
extract_neighbor_area_std = True
extract_clustering_coefficient = True

; ─── Individual Texture Feature Selection ─────────────────────────────────────
; Control individual texture features for chromatin organization analysis.
; Only used when extract_texture_features = True.
extract_intensity_mean = False
extract_intensity_std = False
extract_intensity_median = False
extract_intensity_skewness = False
extract_intensity_kurtosis = False
extract_texture_entropy = False
extract_gradient_magnitude_mean = False
extract_gradient_magnitude_std = False
extract_glcm_contrast = False
extract_glcm_dissimilarity = False
extract_glcm_homogeneity = False
extract_glcm_energy = False

; ─── Spatial Analysis Parameters ──────────────────────────────────────────────
; Neighborhood analysis radius in pixels for spatial context features.
; Larger radius captures broader tissue organization patterns.
; Recommended: 2-3x average nuclear diameter for meaningful spatial analysis.
neighborhood_radius = 20.0

; Maximum number of neighbors to consider for spatial analysis.
; Limits computational complexity for dense tissue regions.
max_neighbors = 50

; ─── Nuclei Filtering Parameters ──────────────────────────────────────────────
; Apply morphological filtering to remove artifacts and improve feature quality.
; These thresholds should match those used in segmentation for consistency.
apply_nuclei_filtering = False
min_pixels = 20
max_pixels = 900
min_circularity = 0.56
max_circularity = 1.00
min_solidity = 0.765
max_solidity = 1.00
min_eccentricity = 0.00
max_eccentricity = 0.975
min_aspect_ratio = 0.50
max_aspect_ratio = 3.20
min_hole_fraction = 0.00
max_hole_fraction = 0.001

; ─── Performance and Processing Parameters ────────────────────────────────────
; Number of worker processes for feature extraction (-1 for auto-detection).
feature_extraction_workers = 1

; Batch size for memory-efficient processing of large datasets.
extraction_batch_size = 1000

; Enable detailed progress tracking and timing information.
enable_progress_tracking = True

; Enable diagnostic output files with timing and performance metrics.
save_diagnostic_files = True

; ─── Input/Output Paths ───────────────────────────────────────────────────────
; Path to the input DAPI-stained tissue image for feature extraction.
; NOTE: Paths are relative to the project root directory.
extraction_image_path = ../../results/full_IRI_regist/preprocessed/first.tif

; Path to the nuclear segmentation mask file for feature extraction.
extraction_mask_path = ../../results/full_IRI_regist/masks/segmentation_masks.npy

; Output directory for feature extraction results.
extraction_output_dir = ../../results/full_IRI_regist/engineered_features

[clustering]
; ─── Clustering Input/Output Paths ───────────────────────────────────────────
; Path to the engineered features CSV file (output from feature extraction).
features_csv_path = ../../results/full_IRI_regist/engineered_features/engineered_features.csv

; Path to the original preprocessed tissue image for overlay visualizations.
image_path = ../../results/full_IRI_regist/preprocessed/first.tif

; Path to the nuclear segmentation mask file.
mask_path = ../../results/full_IRI_regist/masks/segmentation_masks.npy

; Output directory for clustering analysis results.
clustering_output_dir = ../../results/full_IRI_regist/clustering_analysis

; ─── Clustering Algorithm Parameters ──────────────────────────────────────────
; Default number of clusters for K-means clustering.
default_clusters = 20

; Automatic optimal cluster number selection method.
; Options: 'none', 'silhouette', 'dbi'.
auto_k_method = None

; Maximum number of clusters to test during auto-selection.
max_clusters_test = 25

; Random seed for clustering reproducibility.
clustering_seed = 42

; Batch size for streaming processing (memory efficiency).
clustering_batch_size = 5000

; ─── Visualization Parameters ─────────────────────────────────────────────────
; Generate cluster overlay visualization on original tissue image.
generate_cluster_overlay = True

; Generate PCA visualization of cluster separation in feature space.
generate_pca_plot = True

; Generate feature importance analysis for cluster separation.
generate_feature_importance = True

; Sample size for PCA visualization (memory efficiency).
pca_sample_size = 5000

; Crop region for overlay visualization (fractions: xmin, xmax, ymin, ymax).
overlay_crop_region = 0.1, 0.9, 0.1, 0.9

; Downsampling factor for overlay generation (memory efficiency).
overlay_downsample_factor = 1

; Tile size for memory-efficient overlay processing.
overlay_tile_size = 1024

; Number of worker processes for overlay generation ('auto' or integer).
overlay_workers = auto

; Alpha transparency for overlay visualization (0.0-1.0).
overlay_alpha = 0.85

; Enable GPU acceleration for overlay generation.
overlay_gpu = True

; GPU memory limit in MB for overlay processing.
overlay_memory_limit_mb = 8192

; ─── Color Configuration ──────────────────────────────────────────────────────
; Background type for color optimization ('light' or 'dark').
color_background = dark

; Alpha transparency for cluster colors (0-255, 255=opaque).
color_alpha = 250

; Color saturation level (0.0-1.0, higher=more vivid).
color_saturation = 1.0

; Minimum WCAG contrast ratio for color accessibility.
color_contrast_ratio = 4.5

; Starting hue offset for color generation (0.0-1.0).
color_hue_start = 0.0

; Custom color palette (comma-separated hex codes) - vibrant, non-bluish colors only.
custom_colors = #FF0000, #00FF00, #FF6000, #FF3000, #FF8000, #FFFF00, #FF0080, #80FF00, #FF9000, #FF4000, #00FF80, #FF8040, #40FF80, #FFA000, #FF4080, #40FF40, #FF8080, #80FF80, #FFB000, #FFC000

; ─── Output Parameters ────────────────────────────────────────────────────────
; Save detailed cluster statistics and feature summaries.
save_cluster_statistics = True

; Save trained clustering model for future analysis.
save_clustering_model = True

; Save feature correlation matrix for analysis.
save_feature_correlations = True

; Save feature importance rankings.
save_feature_rankings = True

; ─── Visualization Output Parameters ──────────────────────────────────────────
; Figure format for saved visualizations.
; Options: 'png', 'pdf', 'svg', 'tiff'.
figure_format = png

; DPI resolution for publication-quality figures.
figure_dpi = 300

; Enable statistical testing in comparative visualizations.
enable_statistical_testing = True

; Color scheme for timepoint analysis.
; Comma-separated hex codes for different experimental timepoints.
timepoint_colors = #FF6B6B, #4ECDC4, #45B7D1, #96CEB4, #FFEAA7, #DDA0DD

; ─── Performance and Memory Management ────────────────────────────────────────
; Maximum memory usage in GB for processing optimization.
max_memory_gb = 8.0

; Enable parallel processing where applicable.
enable_parallel_processing = True

; Logging level for debugging and monitoring.
; Options: 'DEBUG', 'INFO', 'WARNING', 'ERROR'.
log_level = INFO

; Enable memory mapping for large datasets.
enable_memory_mapping = True

; Temporary directory for intermediate files.
; When set to 'auto', creates unique timestamped directory (e.g., '20250929_143052_temp').
; Can also specify custom path if needed.
temp_directory = auto

; ─── Quality Control Parameters ───────────────────────────────────────────────
; Minimum area threshold for visualization filtering.
visualization_min_area = 10.0

; Maximum area threshold for visualization filtering.
visualization_max_area = 2000.0

; Outlier filtering percentile for robust statistics.
; Filters extreme values beyond this percentile range.
outlier_filter_percentile = 0.01

; NaN value threshold for data quality control.
; Remove samples with more than this fraction of missing values.
nan_threshold = 0.5

; ─── Advanced Analysis Parameters ─────────────────────────────────────────────
; Enable dimensionality reduction analysis.
enable_dimensionality_reduction = True

; PCA components to retain for analysis.
pca_components = 10

; Enable feature selection based on variance.
enable_feature_selection = False

; Variance threshold for feature selection.
variance_threshold = 0.01

; Enable cross-validation for model evaluation.
enable_cross_validation = False

; Number of cross-validation folds.
cv_folds = 5

