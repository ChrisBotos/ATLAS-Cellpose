[general]
; General configuration for engineered feature extraction and analysis.
; This file contains all parameters related to nuclear morphological feature extraction,
; clustering analysis, and visualization for kidney I/R injury research.

; Enable comprehensive nuclear feature extraction pipeline.
; When enabled, extracts morphological, intensity, texture, and neighborhood features.
enable_feature_extraction = True

; Enable nuclear feature clustering analysis after feature extraction.
; When enabled, automatically clusters extracted features for tissue organization analysis.
enable_clustering = True

; Enable publication-quality visualization generation.
; Creates comprehensive plots and overlays for scientific analysis and publication.
enable_visualizations = True

[feature_extraction]
; ─── Feature Category Selection ───────────────────────────────────────────────
; Extract shape-based morphological features.
; Includes circularity, eccentricity, solidity, convex hull properties, compactness.
; Critical for identifying cellular damage patterns and morphological changes.
shape_features = True

; Extract size-based morphological features.
; Includes area, perimeter, equivalent diameter, axis lengths, bounding box dimensions.
; Essential for quantifying nuclear size variations during injury progression.
size_features = True

; Extract neighborhood-based spatial context features.
; Includes nearest neighbor distances, local density, spatial clustering metrics,
; boundary proximity, and tissue organization patterns.
; Important for understanding cell migration, clustering, and tissue architecture changes.
; WARNING: Neighborhood features are computationally expensive (O(N²) complexity).
neighborhood_features = False

; Extract texture-based intensity and pattern features.
; Includes intensity statistics, GLCM properties, local binary patterns,
; gradient features, and chromatin organization metrics.
; Valuable for detecting apoptosis, necrosis, and chromatin condensation patterns.
texture_features = False

; ─── Individual Feature Control ──────────────────────────────────────────────
; Fine-grained control over specific features for performance optimization.
; Set to False to skip computationally expensive features.

; Shape feature controls.
enable_fractal_dimension = True
enable_convex_hull_features = True

; Neighborhood feature controls (only used if neighborhood_features = True).
enable_pca_clustering = True
enable_spatial_autocorrelation = True
enable_clustering_coefficient = True

; Texture feature controls.
enable_glcm_features = False
enable_gradient_features = True
enable_lbp_features = False

; ─── Advanced Feature Parameters ─────────────────────────────────────────────
; Neighborhood analysis radius in pixels for spatial context features.
; Larger radius captures broader tissue organization patterns.
; Recommended: 2-3x average nuclear diameter for meaningful spatial analysis.
; WARNING: Larger radius significantly increases computation time.
neighborhood_radius = 50.0

; Number of parallel workers for feature extraction processing.
; Set to -1 for automatic detection based on CPU cores.
; Higher values speed up processing but use more memory.
feature_extraction_workers = -1

; ─── Performance Optimization Parameters ──────────────────────────────────────
; Enable optimized neighborhood computation using vectorized operations.
; Significantly faster than individual PCA computations per nucleus.
enable_vectorized_neighborhood = True

; Batch size for neighborhood feature computation.
; Larger batches are faster but use more memory.
neighborhood_batch_size = 1000

; Enable memory-efficient KD-tree caching for repeated neighbor queries.
enable_kdtree_caching = True

; Skip expensive texture features that provide minimal biological insight.
; GLCM and LBP features are very slow and often redundant with basic statistics.
skip_expensive_texture = True

; Minimum nuclear area threshold for feature extraction (pixels).
; Nuclei smaller than this threshold are excluded from analysis.
; Helps filter out debris and segmentation artifacts.
min_nuclear_area = 10.0

; Maximum nuclear area threshold for feature extraction (pixels).
; Nuclei larger than this threshold are excluded from analysis.
; Helps filter out merged nuclei and segmentation errors.
max_nuclear_area = 2000.0

[clustering]
; ─── Nuclear Feature Clustering Configuration ─────────────────────────────────
; Configuration parameters for clustering extracted nuclear features.
; These settings control the clustering analysis of morphological, intensity,
; texture, and neighborhood features for biological interpretation.

; Default number of clusters for K-means clustering.
; Recommended range: 8-20 for typical kidney tissue analysis.
; Higher values provide finer tissue organization resolution.
default_clusters = 12

; Automatic optimal cluster number selection method.
; Options: 'none' (use default_clusters), 'silhouette' (maximize silhouette score),
; 'dbi' (minimize Davies-Bouldin index).
; Silhouette method recommended for biological interpretation.
auto_k_method = silhouette

; Maximum number of clusters to test during auto-selection.
; Higher values allow more granular tissue organization but increase computation time.
max_clusters_test = 25

; Batch size for streaming clustering processing.
; Larger batches are more memory efficient but require more RAM.
; Reduce for systems with limited memory (<16GB RAM).
clustering_batch_size = 5000

; Random seed for clustering reproducibility.
; Use same seed across analyses for consistent results.
clustering_seed = 42

; ─── Clustering Visualization Parameters ──────────────────────────────────────
; Generate cluster overlay visualization on original tissue image.
; Creates publication-quality overlay showing cluster spatial distribution.
generate_cluster_overlay = True

; Generate PCA visualization of cluster separation in feature space.
; Useful for validating cluster quality and biological interpretation.
generate_pca_plot = True

; Generate feature importance analysis for cluster separation.
; Identifies which morphological features contribute most to tissue organization.
generate_feature_importance = True

; Crop region for overlay visualization (fractions of image size).
; Format: xmin, xmax, ymin, ymax (0.0-1.0).
; Use None for full image overlay (memory intensive for large images).
overlay_crop_region = 0.1, 0.9, 0.1, 0.9

; Downsampling factor for overlay generation (memory efficiency).
; Higher values reduce memory usage but decrease visualization resolution.
; Recommended: 1 for publication, 2-4 for quick analysis.
overlay_downsample_factor = 1

; ─── Color Palette Configuration ──────────────────────────────────────────────
; Background type for color optimization ('light' or 'dark').
; Use 'dark' for typical DAPI microscopy images with dark backgrounds.
color_background = dark

; Alpha transparency for cluster colors (0-255, 255=opaque).
; Lower values create semi-transparent overlays for better tissue visibility.
color_alpha = 200

; Color saturation level (0.0-1.0, higher=more vivid).
; High saturation recommended for scientific visualization and cluster distinction.
color_saturation = 0.95

; Minimum contrast ratio for color accessibility (WCAG standard).
; Higher values ensure better visibility but may reduce color variety.
color_contrast_ratio = 4.5

; Starting hue offset for color generation (0.0-1.0).
; Adjust to avoid specific color ranges (e.g., 0.1 to avoid pure red start).
color_hue_start = 0.0

; Custom color palette (optional, comma-separated hex codes).
; When specified, these colors are used first before algorithmic generation.
; Example: #FF0000, #00FF00, #0080FF, #FF00FF, #FF8C00
custom_colors =

; ─── Output and Analysis Parameters ────────────────────────────────────────────
; Output directory for clustering results (relative to main output directory).
; Creates subdirectory within main segmentation output for organization.
clustering_output_subdir = clustering_analysis

; Save detailed cluster statistics and feature summaries.
; Includes per-cluster feature means, standard deviations, and nucleus counts.
save_cluster_statistics = True

; Save trained clustering model for future analysis.
; Allows applying same clustering to additional tissue sections.
save_clustering_model = True

; Sample size for PCA visualization (memory efficiency).
; Larger samples provide better representation but use more memory.
pca_sample_size = 5000

[visualization]
; ─── Visualization Parameters ────────────────────────────────────────────────
; Enable publication-quality violin plot generation.
; Creates density distribution plots grouped by feature categories.
enable_violin_plots = True

; Enable timepoint-specific color coding in visualizations.
; Uses distinct colors for different experimental timepoints (10h, 2d, 14d).
; Essential for comparative analysis across injury progression stages.
timepoint_color_coding = True

; Number of features to display per visualization page.
; Controls plot layout and readability for publication figures.
features_per_page = 9

; Statistical significance testing for group comparisons.
; Performs FDR-corrected statistical tests between experimental conditions.
enable_statistical_testing = True

; Figure resolution for publication-quality outputs (DPI).
; Higher values create larger files but better print quality.
; Recommended: 300 for publication, 150 for presentations.
figure_dpi = 300

; Figure format for saved visualizations.
; Options: 'png', 'pdf', 'svg', 'tiff'.
; PNG recommended for general use, PDF for publications.
figure_format = png

; Color palette for timepoint visualization.
; Comma-separated hex codes for different experimental timepoints.
; Default optimized for 10h, 2d, 14d timepoint analysis.
timepoint_colors = #FF6B6B, #4ECDC4, #45B7D1

; Enable feature correlation heatmap generation.
; Shows relationships between different morphological features.
generate_correlation_heatmap = True

; Enable cluster validation metrics visualization.
; Shows silhouette scores, inertia plots, and other clustering quality metrics.
generate_cluster_validation = True

[advanced]
; ─── Advanced Analysis Parameters ──────────────────────────────────────────────
; Enable dimensionality reduction analysis beyond PCA.
; Includes t-SNE and UMAP for non-linear feature space visualization.
enable_advanced_dimensionality_reduction = False

; Enable hierarchical clustering analysis.
; Provides alternative clustering approach with dendrogram visualization.
enable_hierarchical_clustering = False

; Enable outlier detection and removal.
; Uses isolation forest or local outlier factor for artifact removal.
enable_outlier_detection = False

; Outlier contamination fraction (0.0-0.5).
; Fraction of data expected to be outliers for detection algorithms.
outlier_contamination = 0.05

; Enable feature selection based on clustering performance.
; Automatically selects most discriminative features for clustering.
enable_feature_selection = False

; Number of top features to select for clustering.
; Only used when feature_selection is enabled.
n_selected_features = 20

; Enable cross-validation for clustering stability.
; Tests clustering consistency across different data subsets.
enable_cross_validation = False

; Number of cross-validation folds for stability testing.
cv_folds = 5

[performance]
; ─── Performance and Memory Management ────────────────────────────────────────
; Maximum memory usage for feature processing (GB).
; System will use streaming processing if data exceeds this limit.
max_memory_gb = 8.0

; Enable memory monitoring and optimization.
; Automatically adjusts batch sizes based on available memory.
enable_memory_monitoring = True

; Enable parallel processing for independent operations.
; Uses multiprocessing for feature extraction and visualization generation.
enable_parallel_processing = True

; Temporary directory for large file processing.
; Use fast storage (SSD) for better performance with large datasets.
temp_directory = temp

; Enable progress tracking with rich progress bars.
; Provides detailed progress information during long-running operations.
enable_progress_tracking = True

; Log level for feature extraction and clustering operations.
; Options: 'DEBUG', 'INFO', 'WARNING', 'ERROR'.
; Use 'INFO' for normal operation, 'DEBUG' for troubleshooting.
log_level = INFO