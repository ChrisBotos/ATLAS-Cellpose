[general]
; Name of the job (used for output directory name).
job_name = default
; Path to the input image file (relative to the project directory or absolute path).
image_path = IRI_regist.tif
; Base name for the output directory (timestamp will be appended automatically).
output_dir = default_cellpose3_gpu_diameter0
; Factor to upscale the image before processing (1 = no upscaling).
upscale_factor = 1
; Apply contrast enhancement to improve nuclei visibility.
enhance_contrast = True
; Crop the image to a region of interest to reduce processing time.
crop_image = True
; Crop coordinates as fractions of image size (x_start, x_end, y_start, y_end).
crop_box = 0.38,0.42,0.32,0.36

[clahe]
; Contrast Limited Adaptive Histogram Equalization parameters.
; Clip limit controls the contrast enhancement (higher = more contrast).
cliplimit = 5.0
; Size of grid for adaptive equalization (smaller = more local enhancement).
tile_grid_size = 32,32

[gamma_correction]
; Apply gamma correction to enhance dim regions of the image.
enhance_dim = False
; Minimum and maximum gamma values for adaptive correction.
min_gamma = 1.1
max_gamma = 1.3

[cellpose]
; Cellpose model to use (nuclei, cyto, etc.).
model_type = nuclei
; Use GPU acceleration if available (much faster).
gpu = True
; Use Cellpose3 instead of Cellpose4 for segmentation (True = Cellpose4, False = Cellpose3).
; Cellpose4 provides improved adaptive diameter detection and better boundary accuracy for cells.
; But Cellpose3 nuclei model seems to work better for nuclei.
; Set to False for backward compatibility with Cellpose3 workflows.
use_cellpose4 = False
; Expected diameter of nuclei in pixels (0 = auto-detection).
; Setting diameter=0 enables adaptive diameter learning for both Cellpose3 and Cellpose4.
; Auto-detection allows optimal sizing for varying nuclear morphology across tissue regions.
; No fallback parameters are used - relies entirely on Cellpose's auto-detection.
diameter = 0
; Channel settings: (0,0) for grayscale, (1,0) for RGB with nuclei in first channel.
; Note: channels parameter is deprecated in Cellpose4+ but maintained for compatibility.
channels = 0,0
; Threshold for flow gradient magnitude (lower = more permissive cell boundaries).
flow_threshold = 0.8
; Threshold for cell probability (lower = more sensitive detection).
cellprob_threshold = -14
; Resample parameter for image preprocessing during segmentation.
; Required for Cellpose3, deprecated but still functional in Cellpose4 v4.0.1+.
; Auto-detection with diameter=None/0 works optimally with resample=True.
resample = True

[edge_detection]
; Use edge detection to refine segmentation boundaries.
use_edge_detection = False
; Lower threshold for Canny edge detection (more sensitive).
canny_threshold1 = 50
; Upper threshold for Canny edge detection (less sensitive).
canny_threshold2 = 150

[tiling]
; Use tiling to process large images in smaller chunks (recommended for >4K images).
use_tiling = True

; Size of each tile in pixels (smaller tiles use less memory but create more boundaries).
tile_side_length = 400

; Fraction of overlap between adjacent tiles (higher = better stitching but slower).
; With a value above 0.5 more than 2 tiles will be overlapping in one direction.
; Recommended value is avg_nucleus_size (17) * 4 / tile_side_length.
tile_overlap = 0.2

; Number of tile pairs to process in parallel during each phase of merging.
; Higher values are faster but use more memory. Start with 4-8 for most systems.
merge_batch_size = 4

; Generate down-sampled QC overlays (colour preview) – turn on only for debugging.
qc_overlays = True

; Use full image for QC overlays instead of just the merged tiles.
qc_merge_use_full_image = False

[overlay]
; Length of the side in pixels of the small overlay preview for quick quality assessment.
small_overlay_size = 1300

[debug]
debug_mode = False
; Enable debug mode to save intermediate processing steps and additional logging.

[filtering]
; Apply morphological filtering to remove artifacts and improve segmentation quality.
; This is highly recommended for nuclei segmentation. Especially for removing tiny masks.
use_filtering = True
; Size thresholds (in pixels).
min_pixels = 20
max_pixels = 3000
; Circularity thresholds (0.0 = line, 1.0 = perfect circle).
min_circularity = 0.4
max_circularity = 1.00
; Solidity thresholds (ratio of object area to convex hull area).
min_solidity = 0.6
max_solidity = 1.00
; Eccentricity thresholds (0.0 = circle, 1.0 = line).
min_eccentricity = 0.00
max_eccentricity = 0.99
; Aspect ratio thresholds (major axis / minor axis).
min_aspect_ratio = 0.50
max_aspect_ratio = 4.00
; Hole fraction thresholds (fraction of object area that is holes).
min_hole_fraction = 0.00
max_hole_fraction = 0.05
; Exclude nuclei touching image borders.
exclude_border = False

[using_previous_results]
; If you want to use previous results, set this to True and fill in the paths.
use_previous_results = False
; Path to the previous results directory (relative to the project directory or absolute path).
previous_results_dir = C:/Projects/4step_cs/results/20250724_073836_cpu_cellpose4_diameter0_large_crop
; Skip specific pipeline steps when using previous results.
skip_and_copy_preprocessing = False
skip_and_copy_segmentation = True
skip_and_copy_merging = False
skip_and_copy_postprocessing = False
skip_and_copy_visualization = False
skip_and_copy_filtering = False
