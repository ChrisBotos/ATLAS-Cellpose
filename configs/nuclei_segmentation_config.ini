[General]
image_path = IRI_regist.tif
output_dir = iri_results
upscale_factor = 1
enhance_contrast = True
enhance_dim = False
generate_overlay = True
crop_image = True
crop_bbox = 0.25,0.27, 0.25,0.27

[CLAHE]
cliplimit = 5.0
tile_grid_size = 32,32

[Cellpose]
model_type = nuclei
gpu = True
diameter = 0
channels = 0,0
flow_threshold = 0.9
cellprob_threshold = -9
resample = True
stitch_threshold = 0.4

[EdgeDetection]
use_edge_detection = False
canny_threshold1 = 50
canny_threshold2 = 150

[Watershed]
apply_watershed = False
area_threshold = 1000
local_maxima_footprint = 3,3

[Tiling]
use_tiling = True
tile_side_length = 2048
tile_overlap = 0.2

[Overlay]
small_overlay_size = 1024

[Debug]
debug_mode = False