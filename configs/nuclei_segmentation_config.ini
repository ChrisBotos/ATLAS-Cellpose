[general]
; Path to the input image file (relative to the project directory or absolute path).
image_path = IRI_regist.tif
; Base name for the output directory (timestamp will be appended automatically).
output_dir = full_parallel_no_skips
; Factor to upscale the image before processing (1 = no upscaling).
upscale_factor = 1
; Apply contrast enhancement to improve nuclei visibility.
enhance_contrast = True
; Generate visualization overlays of segmentation results.
generate_full_overlay = False
; Crop the image to a region of interest to reduce processing time.
crop_image = True
; Crop coordinates as fractions of image size (y_start,y_end, x_start,x_end).
crop_box = 0.5,0.56,0.59,0.68

[clahe]
; Contrast Limited Adaptive Histogram Equalization parameters.
; Clip limit controls the contrast enhancement (higher = more contrast).
cliplimit = 5.0
; Size of grid for adaptive equalization (smaller = more local enhancement).
tile_grid_size = 32,32

[gamma_correction]
; Apply gamma correction to enhance dim regions of the image.
enhance_dim = False
; Minimum and maximum gamma values for adaptive correction.
min_gamma = 1.1
max_gamma = 1.3

[cellpose]
; Cellpose model to use (nuclei, cyto, etc.).
model_type = nuclei
; Use GPU acceleration if available (much faster).
gpu = True
; Expected diameter of nuclei in pixels (0 = auto-detection).
; For elongated nuclei, use a larger diameter (12-20) to prevent splitting.
diameter = 0
; Channel settings: (0,0) for grayscale, (1,0) for RGB with nuclei in first channel.
channels = 0,0
; Threshold for flow gradient magnitude (higher = stricter cell boundaries).
flow_threshold = 0.9
; Threshold for cell probability (lower = more sensitive detection).
; Values between -6 and 0 work well for most nuclei. Lower values detect more cells.
cellprob_threshold = -12
; Keep resample as True for when you are using a diameter of 0.
; Resample changes the size of the nuclei to a diameter of 30 which cellpose3 was trained on.
resample = True

; ─── Parallel Processing Parameters ──────────────────────────────────────
; Enable parallel processing for Cellpose3 segmentation to improve performance.
; This processes multiple tiles simultaneously instead of sequentially.
enable_parallel_processing = True

; Number of tiles to process simultaneously in each batch.
; Higher values are faster but use more memory. Start with 2-4 for most systems.
; Reduce if you encounter out-of-memory errors.
parallel_batch_size = 4

; Maximum number of parallel worker threads for batch processing.
; Should not exceed the number of CPU cores. Typically 1-2 works well.
; Higher values may not improve performance due to GPU bottlenecks.
parallel_max_workers = 2

; Memory limit in GB for parallel segmentation processing.
; The system will automatically adjust batch sizes to stay within this limit.
; Set based on your available system memory (6-8 GB works for most systems).
parallel_memory_limit_gb = 6.0

; Timeout in seconds for each batch of tiles during parallel processing.
; Prevents infinite loops and stuck processes. Increase for very large tiles.
parallel_timeout_seconds = 300

[edge_detection]
; Use edge detection to refine segmentation boundaries.
use_edge_detection = False
; Lower threshold for Canny edge detection (more sensitive).
canny_threshold1 = 50
; Upper threshold for Canny edge detection (less sensitive).
canny_threshold2 = 150

[watershed]
; Apply watershed algorithm to split merged nuclei.
; This can help separate truly merged nuclei while preserving elongated shapes.
apply_watershed = False
; Minimum area (in pixels) to consider for watershed splitting.
; Higher values prevent over-segmentation of elongated nuclei.
area_threshold = 150
; Size of footprint for finding local maxima (nuclear centers).
; Larger footprint helps prevent over-segmentation of elongated nuclei.
local_maxima_footprint = 7,7

[tiling]
; Use tiling to process large images in smaller chunks (recommended for >4K images).
use_tiling = True

; Size of each tile in pixels (smaller tiles use less memory but create more boundaries).
tile_side_length = 512

; Fraction of overlap between adjacent tiles (higher = better stitching but slower).
; With a value above 0.5 more than 2 tiles will be overlapping in one direction.
; Recommended value is avg_nucleus_size (17) * 4 / tile_side_length.
tile_overlap = 0.2

; Threshold for merging objects across tiles (fraction of overlap required).
; Lower values merge more objects, higher values create more separate objects.
merge_overlap_threshold = 0.3

; ─── GPU Batched Processing Parameters ────────────────────────────────────
; Maximum number of tiles to process simultaneously during GPU-based merging.
; This parameter represents individual tiles in each processing batch.
; Smaller values use less GPU memory but may be slower for dense tile clusters.
; For large images with thousands of tiles, start with batch_size=1 and let the system auto-optimize.
; The system will automatically determine optimal batch size based on memory constraints and tile density.
gpu_batch_size = 1

; Maximum GPU memory to use in gigabytes for tile merging operations.
; The system will automatically adjust batch sizes to stay within this limit.
; Set to 0 for automatic detection based on available GPU memory.
; Conservative default for systems with 16-32GB GPU memory - adjust based on your hardware.
; Higher values allow larger batches but risk out-of-memory errors.
gpu_memory_limit_gb = 4

; Safety factor for GPU memory estimation to prevent out-of-memory errors.
; Higher values are more conservative but may reduce GPU utilization.
; Range: 1.0 (no safety margin) to 3.0 (very conservative).
; Recommended: 1.3-1.5 for stable systems, 2.0+ for systems with memory pressure.
gpu_memory_safety_factor = 2.5

; Spatial batching strategy for tile grouping during GPU processing.
; Options: "adaptive", "2x2", "spatial", "hybrid".
; - adaptive: Automatically choose best strategy based on tile density and cluster size.
; - 2x2: Prioritize 2x2 tile groups for optimal overlap processing efficiency.
; - spatial: Use spatial chunking for memory efficiency with large sparse clusters.
; - hybrid: Combine 2x2 grouping with spatial chunking for balanced performance.
gpu_spatial_strategy = 2x2

; Enable adaptive batch sizing based on tile spatial distribution and GPU memory status.
; When enabled, the system analyzes tile density and adjusts batch sizes dynamically.
; This can improve performance for mixed dense/sparse tile patterns.
gpu_adaptive_batching = True

; Aggressive GPU memory cleanup between batches to prevent memory fragmentation.
; Enables torch.cuda.empty_cache() and synchronization after each batch.
; May slightly reduce performance but improves memory stability for long processing runs.
gpu_aggressive_cleanup = True

; ─── Timeout and Retry Parameters ──────────────────────────────────────
; Maximum number of retry attempts for failed batch processing operations.
; Helps recover from transient GPU memory errors and processing failures.
gpu_max_retries = 3

; Maximum time in seconds to wait for batch processing before timing out.
; Prevents infinite loops and stuck processes during tile merging.
; Increase for very large tile clusters or slower systems.
gpu_timeout_seconds = 300

; ─── Streaming-merge parameters ──────────────────────────────────────

; Generate down-sampled QC overlays (colour preview) – turn on only for debugging.
qc_overlays = True

; Down-sampling factor for QC overlays: 1 = full resolution, 4 = 8× smaller.
qc_downsample_factor = 1

; Use full image for QC overlays instead of just the merged tiles.
qc_merge_use_full_image = False

; Dtype for the global label canvas. Use uint16 if you are sure the slide
; will never exceed 65 535 objects.
memmap_dtype = uint32


[overlay]
; Length of the side in pixels of the small overlay preview for quick quality assessment.
small_overlay_size = 300

[debug]
debug_mode = True
; Enable debug mode to save intermediate processing steps and additional logging.

[using_previous_results]
; If you want to use previous results, set this to True and fill in the paths.
use_previous_results = False
; Path to the previous results directory (relative to the project directory or absolute path).
previous_results_dir = C:/Projects/I-R-Injury-Spatial-Multiomics-Analysis/results/20250717_020715_cropped_overlap0.2_merge0.3_CLAHE_32_32_5
; Skip specific pipeline steps when using previous results.
skip_and_copy_preprocessing = False
skip_and_copy_segmentation = True
skip_and_copy_merging = False
skip_and_copy_postprocessing = False
skip_and_copy_visualization = False
