[general]
; Name of the job (used for output directory name).
job_name = full
; Path to the input image file (relative to the project directory or absolute path).
image_path = ss_bIRI2.tif
; Base name for the output directory (timestamp will be appended automatically).
output_dir = full_ss_bIRI2_cpu-merge_cellpose3_diameter0
; Factor to upscale the image before processing (1 = no upscaling).
upscale_factor = 1
; Apply contrast enhancement to improve nuclei visibility.
enhance_contrast = True
; Generate visualization overlays of segmentation results.
generate_full_overlay = False
; Crop the image to a region of interest to reduce processing time.
crop_image = False
; Crop coordinates as fractions of image size (y_start,y_end, x_start,x_end).
crop_box = 0.5,0.7,0.5,0.7

[clahe]
; Contrast Limited Adaptive Histogram Equalization parameters.
; Clip limit controls the contrast enhancement (higher = more contrast).
cliplimit = 5.0
; Size of grid for adaptive equalization (smaller = more local enhancement).
tile_grid_size = 32,32

[gamma_correction]
; Apply gamma correction to enhance dim regions of the image.
enhance_dim = False
; Minimum and maximum gamma values for adaptive correction.
min_gamma = 1.1
max_gamma = 1.3

[cellpose]
; Cellpose model to use (nuclei, cyto, etc.).
model_type = nuclei
; Use GPU acceleration if available (much faster).
; OPTIMIZED FOR CPU: Set to False to avoid CUDA issues and timeouts.
gpu = False
; Use Cellpose4 instead of Cellpose3 for segmentation (True = Cellpose4, False = Cellpose3).
; Cellpose4 provides improved adaptive diameter detection and better boundary accuracy.
; Set to False for backward compatibility with Cellpose3 workflows.
use_cellpose4 = False
; Expected diameter of nuclei in pixels (None or 0 = auto-detection).
; Setting diameter=None/0 enables adaptive diameter learning for both Cellpose3 and Cellpose4.
; Auto-detection allows optimal sizing for varying nuclear morphology across tissue regions.
diameter = None
; Channel settings: (0,0) for grayscale, (1,0) for RGB with nuclei in first channel.
; Note: channels parameter is deprecated in Cellpose4+ but maintained for compatibility.
channels = 0,0
; Threshold for flow gradient magnitude (lower = more permissive cell boundaries).
; Default value of 0.9 maintains sensitivity for nuclear boundary detection.
; Priority: maintain high detection sensitivity while improving boundary accuracy.
flow_threshold = 0.9
; Threshold for cell probability (lower = more sensitive detection).
; Keeping at -12 to maintain high sensitivity - missing nuclei is the biggest concern.
; Will optimize flow_threshold first to improve boundaries without losing detection sensitivity.
cellprob_threshold = -12
; Resample parameter for image preprocessing during segmentation.
; Required for Cellpose3, deprecated but still functional in Cellpose4 v4.0.1+.
; Auto-detection with diameter=None/0 works optimally with resample=True.
resample = True

; ─── Parallel Processing Parameters ──────────────────────────────────────
; Enable parallel processing for Cellpose4 segmentation to improve performance.
; This processes multiple tiles simultaneously instead of sequentially.
; TEMPORARILY DISABLED FOR DEBUGGING: Test sequential processing first.
enable_parallel_processing = False

; Number of tiles to process simultaneously in each batch.
; OPTIMIZED FOR CPU: Reduced from 4 to 2 to prevent timeout issues.
; CPU processing is slower and needs smaller batches to avoid timeouts.
parallel_batch_size = 2

; Maximum number of parallel worker threads for batch processing.
; OPTIMIZED FOR CPU: Reduced from 4 to 2 for better stability.
; CPU-only processing benefits from fewer concurrent workers.
parallel_max_workers = 2

; Memory limit in GB for parallel segmentation processing.
; OPTIMIZED FOR CPU: Reduced to 4GB to prevent memory pressure.
; CPU processing uses less memory but needs conservative limits.
parallel_memory_limit_gb = 4.0

; Timeout in seconds for each batch of tiles during parallel processing.
; Prevents infinite loops and stuck processes. Increase for very large tiles.
parallel_timeout_seconds = 1000

[edge_detection]
; Use edge detection to refine segmentation boundaries.
use_edge_detection = False
; Lower threshold for Canny edge detection (more sensitive).
canny_threshold1 = 50
; Upper threshold for Canny edge detection (less sensitive).
canny_threshold2 = 150

[watershed]
; Apply watershed algorithm to split merged nuclei.
; This helps separate truly merged nuclei while preserving elongated shapes.
apply_watershed = False
; Minimum area (in pixels) to consider for watershed splitting.
; Higher values prevent over-segmentation of elongated nuclei.
area_threshold = 150
; Size of footprint for finding local maxima (nuclear centers).
; Larger footprint helps prevent over-segmentation of elongated nuclei.
local_maxima_footprint = 7,7

[tiling]
; Use tiling to process large images in smaller chunks (recommended for >4K images).
use_tiling = True

; Size of each tile in pixels (smaller tiles use less memory but create more boundaries).
tile_side_length = 512

; Fraction of overlap between adjacent tiles (higher = better stitching but slower).
; With a value above 0.5 more than 2 tiles will be overlapping in one direction.
; Recommended value is avg_nucleus_size (17) * 4 / tile_side_length.
tile_overlap = 0.2

; Note: The merge_overlap_threshold parameter has been removed in the new 3-step
; merging algorithm. The new algorithm uses a priority-based approach that
; automatically determines which nuclei to merge based on tile nucleus counts
; and border-touching behavior, eliminating the need for manual threshold tuning.

; ─── Two-Phase Merging Parameters ─────────────────────────────────────────
; Enable the new two-phase merging strategy for systematic overlap processing.
; This approach processes vertical overlaps first, then horizontal overlaps,
; ensuring consistent merge results and better handling of cross-boundary nuclei.
use_two_phase_merge = True

; Number of tile pairs to process in parallel during each phase of merging.
; Higher values are faster but use more memory. Start with 4-8 for most systems.
; This parameter controls parallelization within each phase, not cluster size.
merge_batch_size = 4

; ─── GPU Batched Processing Parameters ────────────────────────────────────
; Maximum number of tiles to process simultaneously during GPU-based merging.
; This parameter represents individual tiles in each processing batch.
; MEMORY SAFE: Always use 1 for maximum memory safety and to prevent problematic array allocations.
; The new intelligent clustering algorithm prevents oversized clusters from being created.
gpu_batch_size = 1

; Maximum GPU memory to use in gigabytes for tile merging operations.
; The system will automatically adjust batch sizes to stay within this limit.
; Set to 0 for automatic detection based on available GPU memory.
; MEMORY SAFE: Conservative limit to prevent out-of-memory errors on 6863MB systems.
gpu_memory_limit_gb = 2

; Safety factor for GPU memory estimation to prevent out-of-memory errors.
; Higher values are more conservative but may reduce GPU utilization.
; Range: 1.0 (no safety margin) to 3.0 (very conservative).
; MEMORY SAFE: High safety factor for maximum protection against allocation failures.
gpu_memory_safety_factor = 3.0

; Spatial batching strategy for tile grouping during GPU processing.
; Options: "adaptive", "2x2", "spatial", "hybrid".
; - adaptive: Automatically choose best strategy based on tile density and cluster size.
; - 2x2: Prioritize 2x2 tile groups for optimal overlap processing efficiency.
; - spatial: Use spatial chunking for memory efficiency with large sparse clusters.
; - hybrid: Combine 2x2 grouping with spatial chunking for balanced performance.
; MEMORY SAFE: Use spatial strategy for sparse distributions to minimize bounding box size.
gpu_spatial_strategy = spatial

; Enable adaptive batch sizing based on tile spatial distribution and GPU memory status.
; When enabled, the system analyzes tile density and adjusts batch sizes dynamically.
; This can improve performance for mixed dense/sparse tile patterns.
; MEMORY SAFE: Enable adaptive batching to handle sparse distributions intelligently.
gpu_adaptive_batching = True

; ─── Memory-Aware Clustering Parameters ──────────────────────────────────
; Maximum memory per cluster in gigabytes for the new intelligent clustering algorithm.
; This prevents the creation of oversized clusters that cause memory allocation failures.
; ULTRA SAFE: Extremely conservative per-cluster limit to prevent any memory issues.
max_cluster_memory_gb = 0.1

; Maximum bounding box dimension per cluster in pixels.
; Clusters exceeding this dimension will be split into smaller sub-clusters.
; ULTRA SAFE: Very conservative dimension limit to handle sparse distributions.
max_cluster_dimension = 1024

; ─── Adaptive Cluster Subdivision Parameters ─────────────────────────────
; Maximum GPU memory per cluster in gigabytes for GPU processing.
; Clusters exceeding this limit will be automatically subdivided before GPU processing.
; This prevents massive GPU memory allocation attempts (200-800+ GiB).
; ULTRA SAFE: Extremely conservative limit to prevent any GPU memory issues.
max_cluster_gpu_memory_gb = 0.05

; Strategy for subdividing oversized clusters to fit within GPU memory limits.
; Options: "spatial_quadtree", "spatial_grid", "density_based", "hybrid".
; - spatial_quadtree: Recursively divide clusters into quadrants until memory-safe.
; - spatial_grid: Use regular grid subdivision with configurable grid size.
; - density_based: Subdivide based on tile density and spatial distribution.
; - hybrid: Combine multiple strategies for optimal subdivision.
; RECOMMENDED: spatial_quadtree for most cases, hybrid for complex distributions.
cluster_subdivision_strategy = spatial_quadtree

; Maximum depth for recursive cluster subdivision to prevent infinite loops.
; Each subdivision level divides clusters into smaller parts.
; Higher values allow more aggressive subdivision but may create very small clusters.
; SAFETY: Prevents infinite subdivision loops in pathological cases.
max_subdivision_depth = 6

; Minimum cluster size after subdivision (number of tiles).
; Prevents over-subdivision that would create inefficiently small clusters.
; Clusters smaller than this will not be subdivided further.
; ULTRA SAFE: Allow individual tiles to ensure maximum memory safety.
min_cluster_size_after_subdivision = 1

; ─── uint32 ID Management Parameters ──────────────────────────────────────
; Strategy for managing uint32 ID overflow during large image processing.
; Options: "segmented_reset", "conservative_limit", "early_warning", "hybrid".
; - segmented_reset: Reset ID counter in segments to prevent conflicts.
; - conservative_limit: Use conservative ID limits with early overflow detection.
; - early_warning: Provide warnings before approaching uint32 limits.
; - hybrid: Combine multiple strategies for maximum safety.
; CRITICAL: Prevents "Python integer out of bounds for uint32" errors.
uint32_id_management = hybrid

; Conservative limit for uint32 IDs to trigger early reset/warning.
; Set well below 2^32-1 (4,294,967,295) to provide safety margin.
; When ID counter approaches this limit, automatic management is triggered.
; SAFETY: Prevents overflow errors while maintaining processing continuity.
uint32_conservative_limit = 2000000000

; Size of ID segments when using segmented reset strategy.
; Each segment reserves a range of IDs to minimize conflicts during resets.
; Larger segments reduce reset frequency but may waste ID space.
; BALANCE: Large enough to minimize resets, small enough to prevent waste.
uint32_segment_size = 100000000

; Enable comprehensive progress tracking during tile merging operations.
; Shows detailed progress bars with time estimates and processing statistics.
enable_progress_tracking = True

; Aggressive GPU memory cleanup between batches to prevent memory fragmentation.
; Enables torch.cuda.empty_cache() and synchronization after each batch.
; May slightly reduce performance but improves memory stability for long processing runs.
gpu_aggressive_cleanup = True

; ─── Timeout and Retry Parameters ──────────────────────────────────────
; Maximum number of retry attempts for failed batch processing operations.
; Helps recover from transient GPU memory errors and processing failures.
gpu_max_retries = 3

; Maximum time in seconds to wait for batch processing before timing out.
; Prevents infinite loops and stuck processes during tile merging.
; Increase for very large tile clusters or slower systems.
gpu_timeout_seconds = 300

; ─── Streaming-merge parameters ──────────────────────────────────────

; Generate down-sampled QC overlays (colour preview) – turn on only for debugging.
qc_overlays = True

; Down-sampling factor for QC overlays: 1 = full resolution, 4 = 8× smaller.
qc_downsample_factor = 1

; Use full image for QC overlays instead of just the merged tiles.
qc_merge_use_full_image = False

; Dtype for the global label canvas. Use uint16 if you are sure the slide
; will never exceed 65 535 objects.
memmap_dtype = uint32


[overlay]
; Length of the side in pixels of the small overlay preview for quick quality assessment.
small_overlay_size = 1300

[debug]
debug_mode = True
; Enable debug mode to save intermediate processing steps and additional logging.

[using_previous_results]
; If you want to use previous results, set this to True and fill in the paths.
use_previous_results = False
; Path to the previous results directory (relative to the project directory or absolute path).
previous_results_dir = C:/Projects/3step_cs/results/20250724_073836_cpu_cellpose4_diameter0_large_crop
; Skip specific pipeline steps when using previous results.
skip_and_copy_preprocessing = False
skip_and_copy_segmentation = True
skip_and_copy_merging = False
skip_and_copy_postprocessing = False
skip_and_copy_visualization = False
